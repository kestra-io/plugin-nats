services:
  nats:
    build: .
    healthcheck:
      test: /init-nats.sh
    command:
      - '--config'
      - 'nats-server.conf'
      - '--user'
      - 'kestra'
      - '--pass'
      - 'k3stra'
      - '-js'
      - '-n'
      - 'kestra-server'
      - '-c'
      - '/js.conf'
      - '-m'
      - '8222'
    ports:
      - "4222:4222"
      - "8222:8222"
